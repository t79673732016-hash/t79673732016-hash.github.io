<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDame</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --hl-kw: #ff79c6; --hl-bi: #8be9fd; --hl-st: #f1fa8c; --hl-nm: #ffb86c;
    --hl-cm: #6272a4; --hl-op: #ff79c6; --hl-var: #50fa7b; --hl-spr: #8affc1;
    --hl-ani: #bd93f9; --hl-mus: #ff6e6e; --hl-tag: #e6db74;
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#07090e; font-family: 'Courier New', monospace; color:#c3e9ff; }
  #app { display:flex; width:100%; height:100%; }
  #left { flex:1; display:flex; justify-content:center; align-items:center; gap:26px; padding:20px; }
  #palette { display:none; flex-direction:column; gap:12px; align-items:center; }
  canvas { display:block; background:#0a0d14; border-radius:14px; box-shadow: inset 0 0 40px #000a, 0 8px 40px #0008; }
  canvas.draggable { cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  canvas.picker { cursor: crosshair; }
  canvas.grid { cursor: crosshair; }
  #right { width:340px; background:#0f1320; padding:16px; display:flex; flex-direction:column; gap:10px; border-left:1px solid #1c2330; overflow-y:auto; }
  .btn { padding:10px 14px; border-radius:8px; border:1px solid #2a3344; background:linear-gradient(180deg,#222c3e,#131a28); color:#c3e9ff; cursor:pointer; font-family:inherit; font-size:13px; text-align:left; transition: all .15s; }
  .btn:hover { border-color:#4a8fdc; box-shadow:0 0 12px #2a6fb066; color:#eaf6ff; }
  .btn.active { border-color:#4a8fdc; background:linear-gradient(180deg,#2a4a6e,#1a2c44); box-shadow:0 0 14px #4a8fdc55; }
  .sprite-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#161c2a; border:1px solid #222b3c; border-radius:6px; font-size:12px; gap:6px; }
  .sprite-item span.name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .sprite-item span.name.clickable { cursor:pointer; }
  .sprite-item span.name.clickable:hover { color:#7fc8ff; }
  .sprite-tags { display:flex; flex-wrap:wrap; gap:3px; margin-top:2px; }
  .tag-badge { font-size:10px; background:#2a3a54; color:#7fb8e0; padding:1px 6px; border-radius:8px; border:1px solid #3a4a6a; }
  .actions { display:flex; gap:4px; }
  .plus { cursor:pointer; color:#4a8fdc; font-weight:bold; padding:0 6px; font-size:16px; line-height:1; user-select:none; }
  .plus:hover { color:#7fc8ff; text-shadow:0 0 10px #4a8fdc; }
  .plus.danger { color:#c05050; }
  .plus.danger:hover { color:#ff7070; text-shadow:0 0 10px #c05050; }
  .plus.play { color:#40c060; }
  .plus.play:hover { color:#70e090; text-shadow:0 0 10px #40c060; }
  .plus.warn { color:#d0a040; }
  .plus.warn:hover { color:#ffd070; text-shadow:0 0 10px #d0a040; }
  .plus.tag { color:#a57bd4; }
  .plus.tag:hover { color:#d0a0ff; text-shadow:0 0 10px #a57bd4; }
  .color-swatch { width:40px; height:40px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition: all .15s; }
  .color-swatch:hover { transform:scale(1.1); }
  .color-swatch.active { border-color:#fff; box-shadow:0 0 18px #fff9; }
  .fill-btn { min-width:64px; height:40px; padding:0 12px; border-radius:10px; cursor:pointer; border:3px solid transparent; background:#1a2130; color:#c3e9ff; display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:12px; transition: all .15s; letter-spacing:.5px; }
  .fill-btn:hover { transform:scale(1.08); background:#232c3e; }
  .fill-btn.active { border-color:#4a8fdc; background:#2a4a6e; box-shadow:0 0 14px #4a8fdc55; }
  input[type="text"], input[type="number"] { padding:8px 10px; background:#0a0e16; border:1px solid #2a3344; border-radius:6px; color:#c3e9ff; font-family:inherit; font-size:13px; width:100%; outline:none; }
  input[type="text"]:focus, input[type="number"]:focus { border-color:#4a8fdc; }
  textarea { width:100%; min-height:420px; background:#0a0e16; border:1px solid #2a3344; border-radius:6px; color:#c3e9ff; font-family:'Courier New', monospace; font-size:13px; padding:10px; resize:vertical; outline:none; line-height:1.55; tab-size: 2; }
  textarea:focus { border-color:#4a8fdc; box-shadow:0 0 12px #2a6fb033; }
  .code-wrap { position: relative; width: 100%; height: 380px; min-height: 380px; flex-shrink: 0; overflow: hidden; }
  .code-wrap pre, .code-wrap textarea {
    position: absolute; top:0; left:0; width:100%; height:100%;
    min-height:0; max-height:100%; margin:0; padding:10px;
    border:1px solid #2a3344; border-radius:6px;
    font-family:'Courier New', monospace; font-size:13px; line-height:1.55;
    white-space:pre-wrap; word-wrap:break-word; tab-size:2; letter-spacing:0; box-sizing:border-box;
  }
  .code-wrap pre { pointer-events:none; background:#0a0e16; color:#c3e9ff; overflow:hidden; z-index:1; }
  .code-wrap textarea { background:transparent; color:transparent; caret-color:#c3e9ff; resize:none; overflow:auto; z-index:2; outline:none; }
  .code-wrap textarea:focus { border-color:#4a8fdc; }
  .code-wrap .kw { color: var(--hl-kw); }
  .code-wrap .bi { color: var(--hl-bi); }
  .code-wrap .st { color: var(--hl-st); }
  .code-wrap .nm { color: var(--hl-nm); }
  .code-wrap .cm { color: var(--hl-cm); font-style:italic; }
  .code-wrap .op { color: var(--hl-op); }
  .code-wrap .var { color: var(--hl-var); font-weight:bold; }
  .code-wrap .spr { color: var(--hl-spr); font-weight:bold; }
  .code-wrap .ani { color: var(--hl-ani); font-weight:bold; }
  .code-wrap .mus { color: var(--hl-mus); font-weight:bold; }
  .code-wrap .tag { color: var(--hl-tag); font-weight:bold; }
  details.cmd-help { background:#0a0e16; border:1px solid #1c2330; border-radius:6px; padding:6px 10px; flex-shrink:0; max-height:340px; overflow-y:auto; }
  details.cmd-help summary { cursor:pointer; font-size:11px; color:#7fb8e0; text-transform:uppercase; letter-spacing:1.5px; opacity:0.85; padding:4px 0; user-select:none; outline:none; }
  details.cmd-help[open] summary { border-bottom:1px solid #1c2330; margin-bottom:6px; padding-bottom:6px; }
  .frame-strip { display:flex; flex-wrap:wrap; gap:4px; }
  .frame-chip { min-width:32px; height:32px; border-radius:6px; border:2px solid #2a3344; background:#161c2a; color:#c3e9ff; cursor:pointer; font-family:inherit; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .frame-chip.active { border-color:#4a8fdc; background:#2a4a6e; box-shadow:0 0 10px #4a8fdc66; }
  .size-row { display:flex; gap:4px; flex-wrap:wrap; }
  .size-row .btn { flex:1; min-width:56px; padding:6px; text-align:center; }
  .custom-size-row { display:flex; gap:4px; align-items:center; margin-top:4px; }
  .custom-size-row input { width:70px; flex:none; padding:6px 8px; }
  .custom-size-row .btn { padding:6px 12px; text-align:center; flex:none; }
  .color-set-row { display:flex; gap:6px; align-items:center; padding:4px 0; }
  .color-set-row span { flex:1; font-size:12px; color:#c3e9ff; }
  .color-set-row input[type="color"] { width:40px; height:28px; padding:0; border:1px solid #2a3344; background:#0a0e16; border-radius:4px; cursor:pointer; }
  #logWindow { position:fixed; top:20px; left:20px; width:400px; max-height:520px; background:#050810f0; border:1px solid #2a3344; border-radius:10px; padding:14px; font-size:13px; overflow-y:auto; display:none; z-index:100; white-space:pre-wrap; box-shadow: 0 10px 40px #000c; line-height:1.5; }
  .error-box { background:#3a1010; border:1px solid #a03030; color:#ffb0b0; padding:10px; border-radius:6px; font-size:12px; line-height:1.5; }
  h3 { font-size:11px; color:#7fb8e0; margin-top:8px; text-transform:uppercase; letter-spacing:1.5px; opacity:.8; }
  .hint { font-size:11px; color:#5c7a99; line-height:1.7; }
  #modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:200; backdrop-filter: blur(4px); }
  #modalOverlay.show { display:flex; }
  #modalBox { background:#131a28; border:1px solid #2a3344; border-radius:14px; padding:22px; width:340px; box-shadow:0 20px 60px #000d; display:flex; flex-direction:column; gap:14px; }
  #modalTitle { font-size:13px; color:#7fb8e0; text-transform:uppercase; letter-spacing:1px; }
  #modalInput { display:none; }
  #modalMsg { font-size:14px; color:#c3e9ff; line-height:1.5; }
  #modalButtons { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  #modalButtons .btn { flex:none; min-width:80px; text-align:center; }
  .btn.primary { border-color:#4a8fdc; background:linear-gradient(180deg,#2a4a6e,#1a2c44); }
  .btn.danger { border-color:#a03030; background:linear-gradient(180deg,#4a1e1e,#2c1010); color:#ffb0b0; }
  .mode-badge { font-size:11px; color:#d0a040; background:#2a2010; border:1px solid #4a3a20; padding:4px 10px; border-radius:20px; text-align:center; margin-top:6px; letter-spacing:.5px; }
  #toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); background:#131a28; border:1px solid #4a8fdc; color:#c3e9ff; padding:12px 24px; border-radius:10px; font-family:'Courier New', monospace; font-size:15px; opacity:0; pointer-events:none; transition:all .25s; z-index:300; box-shadow:0 0 24px #4a8fdc66; letter-spacing:.5px; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="palette"></div>
    <canvas id="cv" width="600" height="600"></canvas>
  </div>
  <div id="right"></div>
</div>
<div id="logWindow"></div>
<div id="toast"></div>
<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalTitle"></div>
    <div id="modalMsg"></div>
    <input type="text" id="modalInput" />
    <div id="modalButtons"></div>
  </div>
</div>
<script>
(function(){
  let WORLD = 24;
  const DEFAULT_WORLD = 24;
  const MIN_WORLD = 8;
  const MAX_WORLD = 64;
  const DEFAULT_SPRITE_SIZE = 8;
  const MIN_SPRITE_SIZE = 2;
  const MAX_SPRITE_SIZE = 32;
  const COLORS = { red:'#ff3b3b', green:'#2ecc71', yellow:'#f1c40f', blue:'#3498db', black:'#000000', white:'#ffffff', gray:'#808080' };
  const COLOR_KEYS = ['red','green','yellow','blue','black','white','gray'];
  const PIX_CHAR = { '#ff3b3b':'r', '#2ecc71':'g', '#f1c40f':'y', '#3498db':'b', '#000000':'k', '#ffffff':'w', '#808080':'a' };
  const PIX_CHAR_REV = { 'r':'#ff3b3b', 'g':'#2ecc71', 'y':'#f1c40f', 'b':'#3498db', 'k':'#000000', 'w':'#ffffff', 'a':'#808080' };
  function encodePixels(px) { if (typeof px === 'string') return px; return px.map(row => row.map(c => PIX_CHAR[c] || '.').join('')).join('/'); }
  function decodePixels(data, size) {
    if (Array.isArray(data)) return data;
    if (typeof data !== 'string') return Array.from({length:size},()=>Array(size).fill(null));
    return data.split('/').map(row => row.split('').map(c => PIX_CHAR_REV[c] || null));
  }

  const STORAGE_KEY = 'ledame_games_v3';
  const MUSIC_KEY = 'ledame_music_v1';
  const SYNTAX_KEY = 'ledame_syntax_colors_v1';
  const LEGACY_KEYS = ['ledame_games_v1', 'ledame_games_v2'];
  const FILE_FORMAT = 'ledame';
  const FILE_VERSION = 3;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const right = document.getElementById('right');
  const paletteEl = document.getElementById('palette');
  const logWin = document.getElementById('logWindow');
  const toastEl = document.getElementById('toast');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalMsg = document.getElementById('modalMsg');
  const modalInput = document.getElementById('modalInput');
  const modalButtons = document.getElementById('modalButtons');

  const DEFAULT_SYNTAX = { kw:'#ff79c6', bi:'#8be9fd', st:'#f1fa8c', nm:'#ffb86c', cm:'#6272a4', op:'#ff79c6', var:'#50fa7b', sprite:'#8affc1', anim:'#bd93f9', music:'#ff6e6e', tag:'#e6db74' };
  let syntaxColors = Object.assign({}, DEFAULT_SYNTAX);
  function applySyntaxColors() {
    const r = document.documentElement;
    r.style.setProperty('--hl-kw', syntaxColors.kw); r.style.setProperty('--hl-bi', syntaxColors.bi);
    r.style.setProperty('--hl-st', syntaxColors.st); r.style.setProperty('--hl-nm', syntaxColors.nm);
    r.style.setProperty('--hl-cm', syntaxColors.cm); r.style.setProperty('--hl-op', syntaxColors.op);
    r.style.setProperty('--hl-var', syntaxColors.var); r.style.setProperty('--hl-spr', syntaxColors.sprite);
    r.style.setProperty('--hl-ani', syntaxColors.anim); r.style.setProperty('--hl-mus', syntaxColors.music);
    r.style.setProperty('--hl-tag', syntaxColors.tag);
  }
  function loadSyntaxColors() {
    try { const raw = localStorage.getItem(SYNTAX_KEY); if (raw) { const p = JSON.parse(raw); for (const k in DEFAULT_SYNTAX) if (typeof p[k] === 'string') syntaxColors[k] = p[k]; } } catch (e) {}
    applySyntaxColors();
  }
  function saveSyntaxColors() { try { localStorage.setItem(SYNTAX_KEY, JSON.stringify(syntaxColors)); } catch (e) {} }

  class BreakSignal {}
  class ContinueSignal {}

  const KEYWORDS = ['if','elseif','else','while','function','end','var','True','False','break','continue'];
  const BUILTINS = ['LEDame','TSprite','all','mouse','key','mpos','Spos','Scan','Wait','createP','createT','DelP','print','sound','rotation','random','connected','hold','released','Spawn','Kill','math','str','gp','tags','anim'];

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function collectNames(game, musicList) {
    const varsSet = new Set(), spritesSet = new Set(), animsSet = new Set(), musicSet = new Set(), tagsSet = new Set();
    const varRegex = /\bvar\s+([A-Za-z_]\w*)/g;
    if (game) {
      for (const s of (game.sprites || [])) {
        spritesSet.add(s.name);
        for (const t of (s.tags || [])) tagsSet.add(t);
        if (s.script) { let m; while ((m = varRegex.exec(s.script)) !== null) varsSet.add(m[1]); }
      }
      if (game.globalScript) { let m; while ((m = varRegex.exec(game.globalScript)) !== null) varsSet.add(m[1]); }
      for (const a of (game.animations || [])) animsSet.add(a.name);
    }
    if (musicList) for (const m of musicList) musicSet.add(m.name);
    return { varsSet, spritesSet, animsSet, musicSet, tagsSet };
  }
  function highlightCode(code, game, musicList) {
    const { varsSet, spritesSet, animsSet, musicSet, tagsSet } = collectNames(game, musicList);
    const parts = []; let i = 0; const n = code.length;
    while (i < n) {
      const c = code[i];
      if (c === '/' && code[i+1] === '/') { let j = i; while (j < n && code[j] !== '\n') j++; parts.push(['cm', code.slice(i, j)]); i = j; continue; }
      if (c === '"' || c === "'") {
        const q = c; let j = i + 1;
        while (j < n && code[j] !== q && code[j] !== '\n') { if (code[j] === '\\' && j+1 < n) j++; j++; }
        if (j < n && code[j] === q) j++; parts.push(['st', code.slice(i, j)]); i = j; continue;
      }
      if (c >= '0' && c <= '9') { let j = i; while (j < n && ((code[j] >= '0' && code[j] <= '9') || code[j] === '.')) j++; parts.push(['nm', code.slice(i, j)]); i = j; continue; }
      if (/[A-Za-z_]/.test(c)) {
        let j = i; while (j < n && /[A-Za-z0-9_]/.test(code[j])) j++;
        const word = code.slice(i, j); let cls = null;
        if (KEYWORDS.includes(word)) cls = 'kw';
        else if (BUILTINS.includes(word)) cls = 'bi';
        else if (varsSet.has(word)) cls = 'var';
        else if (spritesSet.has(word)) cls = 'spr';
        else if (animsSet.has(word)) cls = 'ani';
        else if (musicSet.has(word)) cls = 'mus';
        else if (tagsSet.has(word)) cls = 'tag';
        parts.push([cls, word]); i = j; continue;
      }
      if ('+-*/%<>=!'.includes(c)) { let j = i; while (j < n && '+-*/%<>=!'.includes(code[j])) j++; parts.push(['op', code.slice(i, j)]); i = j; continue; }
      parts.push([null, c]); i++;
    }
    return parts.map(([cls, txt]) => { const esc = escHtml(txt); return cls ? `<span class="${cls}">${esc}</span>` : esc; }).join('') + '\n';
  }

  let toastTimeout = null;
  function showToast(text) { toastEl.textContent = text; toastEl.classList.add('show'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1600); }
  function closeModal() { modalOverlay.classList.remove('show'); }
  function showPrompt(title, defaultValue) {
    return new Promise(resolve => {
      modalTitle.textContent = title; modalMsg.style.display = 'none';
      modalInput.style.display = 'block'; modalInput.value = defaultValue || '';
      modalButtons.innerHTML = '';
      const cancel = el('button', 'btn', 'Отмена'); cancel.onclick = () => { closeModal(); resolve(null); };
      const ok = el('button', 'btn primary', 'OK'); ok.onclick = () => { const v = modalInput.value; closeModal(); resolve(v); };
      modalButtons.appendChild(cancel); modalButtons.appendChild(ok);
      modalOverlay.classList.add('show');
      setTimeout(() => { modalInput.focus(); modalInput.select(); }, 30);
      modalInput.onkeydown = (e) => {
        if (e.key === 'Enter') { const v = modalInput.value; closeModal(); resolve(v); }
        if (e.key === 'Escape') { closeModal(); resolve(null); }
      };
    });
  }
  function showConfirm(title, message, okLabel) {
    return new Promise(resolve => {
      modalTitle.textContent = title; modalMsg.style.display = 'block'; modalMsg.textContent = message;
      modalInput.style.display = 'none'; modalButtons.innerHTML = '';
      const cancel = el('button', 'btn', 'Отмена'); cancel.onclick = () => { closeModal(); resolve(false); };
      const ok = el('button', 'btn danger', okLabel || 'Удалить'); ok.onclick = () => { closeModal(); resolve(true); };
      modalButtons.appendChild(cancel); modalButtons.appendChild(ok);
      modalOverlay.classList.add('show');
      setTimeout(() => ok.focus(), 30);
    });
  }
  function showAlert(title, message) {
    return new Promise(resolve => {
      modalTitle.textContent = title; modalMsg.style.display = 'block'; modalMsg.textContent = message;
      modalInput.style.display = 'none'; modalButtons.innerHTML = '';
      const ok = el('button', 'btn primary', 'OK'); ok.onclick = () => { closeModal(); resolve(true); };
      modalButtons.appendChild(ok);
      modalOverlay.classList.add('show');
      setTimeout(() => ok.focus(), 30);
    });
  }
  function showChoice(title, message, choices) {
    return new Promise(resolve => {
      modalTitle.textContent = title; modalMsg.style.display = 'block'; modalMsg.textContent = message;
      modalInput.style.display = 'none'; modalButtons.innerHTML = '';
      for (const c of choices) {
        const b = el('button', 'btn' + (c.primary ? ' primary' : '') + (c.danger ? ' danger' : ''), c.label);
        b.onclick = () => { closeModal(); resolve(c.value); };
        modalButtons.appendChild(b);
      }
      modalOverlay.classList.add('show');
    });
  }

  function parseTags(str) {
    return String(str || '').split(/[,\s]+/).map(t => t.trim()).filter(t => /^[A-Za-z_]\w*$/.test(t)).filter((t, i, arr) => arr.indexOf(t) === i);
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
  function playMusicTrack(track, volume, speed) {
    if (!track || !track.notes || !track.notes.length) return;
    const actx = getAudioCtx(); if (!actx) return;
    const vol = (volume === undefined || volume === null || volume === '') ? 0.3 : Math.max(0, Math.min(1, Number(volume) || 0));
    const sp = (speed === undefined || speed === null || speed === '') ? 1 : Math.max(0.1, Number(speed) || 1);
    const bpm = track.bpm || 120; const beatSec = (60 / bpm) / sp;
    const start = actx.currentTime + 0.05;
    const master = actx.createGain(); master.gain.value = vol; master.connect(actx.destination);
    for (const n of track.notes) {
      const freq = midiToFreq(n.midi); const t = start + n.beat * beatSec; const dur = beatSec * 0.9;
      const osc = actx.createOscillator(); const g1 = actx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq;
      g1.gain.setValueAtTime(0, t); g1.gain.linearRampToValueAtTime(0.7, t + 0.01); g1.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g1).connect(master); osc.start(t); osc.stop(t + dur + 0.05);
      const osc2 = actx.createOscillator(); const g2 = actx.createGain();
      osc2.type = 'sine'; osc2.frequency.value = freq / 2;
      g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.3, t + 0.01); g2.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc2.connect(g2).connect(master); osc2.start(t); osc2.stop(t + dur + 0.05);
    }
  }

  let music = [];
  function scheduleMusicSave() { try { localStorage.setItem(MUSIC_KEY, JSON.stringify(music)); } catch (e) {} }
  function loadSavedMusic() {
    try {

  function drawLEDGrid(size, cols, rows) {
    const cell = size / cols;
    ctx.fillStyle = '#0a0d14'; ctx.fillRect(0, 0, size, size);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      ctx.beginPath(); ctx.arc(x*cell + cell/2, y*cell + cell/2, cell*0.36, 0, Math.PI*2);
      ctx.fillStyle = '#111622'; ctx.fill();
    }
    return cell;
  }
  function renderMenuCanvas() { syncWorldFromGame(); const size = canvasSize(); if (cv.width !== size) { cv.width = size; cv.height = size; } drawLEDGrid(size, WORLD, WORLD); }
  function renderSpriteCreatorCanvas() {
    const maxSize = Math.min(window.innerWidth - 480, window.innerHeight - 80);
    const n = editingSprite.pixels.length;
    const cell = Math.max(16, Math.min(62, Math.floor(maxSize / n)));
    const size = cell * n; if (cv.width !== size) { cv.width = size; cv.height = size; }
    ctx.fillStyle = '#0a0d14'; ctx.fillRect(0, 0, size, size);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const cx = x*cell + cell/2, cy = y*cell + cell/2;
      ctx.beginPath(); ctx.arc(cx, cy, cell*0.36, 0, Math.PI*2);
      ctx.fillStyle = '#111622'; ctx.fill();
      const col = editingSprite.pixels[y][x];
      if (col) { ctx.beginPath(); ctx.arc(cx, cy, cell*0.4, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill(); }
    }
  }
  function renderAnimationEditorCanvas() {
    if (!editingAnimation) return;
    const maxSize = Math.min(window.innerWidth - 480, window.innerHeight - 80);
    const n = editingAnimation.size;
    const cell = Math.max(16, Math.min(62, Math.floor(maxSize / n)));
    const size = cell * n; if (cv.width !== size) { cv.width = size; cv.height = size; }
    ctx.fillStyle = '#0a0d14'; ctx.fillRect(0, 0, size, size);
    const frame = editingAnimation.frames[editingAnimationFrameIndex]; if (!frame) return;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const cx = x*cell + cell/2, cy = y*cell + cell/2;
      ctx.beginPath(); ctx.arc(cx, cy, cell*0.36, 0, Math.PI*2);
      ctx.fillStyle = '#111622'; ctx.fill();
      const col = frame.pixels[y] && frame.pixels[y][x];
      if (col) { ctx.beginPath(); ctx.arc(cx, cy, cell*0.4, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill(); }
    }
  }
  function drawPixelsAt(pixels, sz, x, y, cell) {
    for (let sy = 0; sy < sz; sy++) for (let sx = 0; sx < sz; sx++) {
      const c = pixels[sy] && pixels[sy][sx]; if (!c) continue;
      const wx = x + sx, wy = y + sy;
      if (wx < 0 || wx >= WORLD || wy < 0 || wy >= WORLD) continue;
      ctx.beginPath(); ctx.arc(wx*cell + cell/2, wy*cell + cell/2, cell*0.4, 0, Math.PI*2);
      ctx.fillStyle = c; ctx.fill();
    }
  }
  function drawSprite(s, cell, outline) {

    if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = 2; ctx.strokeRect(s.x*cell + 1, s.y*cell + 1, sz*cell - 2, sz*cell - 2); }
  }
  function renderEditorCanvas() {

  function renderMusicEditorCanvas() {
    const layout = musicEditorLayout();
    if (cv.width !== layout.totalW) cv.width = layout.totalW;
    if (cv.height !== layout.totalH) cv.height = layout.totalH;
    ctx.fillStyle = '#0a0d14'; ctx.fillRect(0, 0, cv.width, cv.height);
    const { cell, labelW } = layout;
    for (let r = 0; r < MUSIC_ROWS; r++) {
      const isSharp = isSharpRow(r);
      const bg = isSharp ? '#0d1220' : '#111827'; const bgActive = isSharp ? '#5cd6ff' : '#a3f0c0';
      const y = r * cell; const midi = MIDI_TOP - r;
      ctx.fillStyle = isSharp ? '#40506a' : '#7fa8c8';
      ctx.font = Math.floor(cell*0.5) + 'px "Courier New", monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(midiToName(midi), labelW - 6, y + cell/2);
      ctx.textAlign = 'left';
      for (let c = 0; c < MUSIC_COLS; c++) {
        const x = labelW + c * cell;
        const active = musicGrid && musicGrid[r][c];
        ctx.fillStyle = active ? bgActive : bg;
        ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
        if (c % 4 === 0) { ctx.fillStyle = '#3a4a6a'; ctx.fillRect(x, y, 1, cell); }

  function renderGame() {
    if (state !== 'playing') return;
    const size = canvasSize(); if (cv.width !== size) { cv.width = size; cv.height = size; }
    const cell = drawLEDGrid(size, WORLD, WORLD);
    for (let y = 0; y < WORLD; y++) for (let x = 0; x < WORLD; x++) {
      if (world[y] && world[y][x] && !worldPixHidden[y][x]) {
        ctx.beginPath(); ctx.arc(x*cell + cell/2, y*cell + cell/2, cell*0.4, 0, Math.PI*2);
        ctx.fillStyle = world[y][x]; ctx.fill();
      }
    }
    const now = performance.now();
    for (const s of sprites) {
      if (s.deleted) continue;
      if (s._anim) {
        const anim = s._anim.animation;
        const elapsed = now - s._anim.startTime;
        const frame = pickFrame(anim.frames, elapsed);
        if (frame) drawPixelsAt(frame.pixels, anim.size, s.x, s.y, cell);

      ctx.setLineDash([4, 4]);
      const gx = grabState.minX * cell;
      const gy = grabState.minY * cell;
      const gw = (grabState.maxX - grabState.minX) * cell;
      const gh = (grabState.maxY - grabState.minY) * cell;
      ctx.strokeRect(gx, gy, gw, gh);
      ctx.setLineDash([]);
    }
    if (mouseDown) {
      for (const s of sprites) {
        if (s.deleted) continue;
        const sz = s.size || DEFAULT_SPRITE_SIZE;
        if (mouseX >= s.x && mouseX < s.x + sz && mouseY >= s.y && mouseY < s.y + sz) {
          ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 2;
          ctx.strokeRect(s.x*cell, s.y*cell, sz*cell, sz*cell);
        }
      }
    }
    ctx.textBaseline = 'top';
    for (const t of worldTexts) {
      if (t.hidden) continue;
      ctx.fillStyle = t.color;
      ctx.font = 'bold ' + Math.floor(cell*1.2) + 'px "Courier New", monospace';
      ctx.fillText(t.text, t.x*cell, t.y*cell);
    }
  }

    if (line === 'LEDame.restart') { gameGen++; await new Promise(r => setTimeout(r, 20)); startGame(); return; }
    if (line === 'TSprite.delete') { if (ctxObj.sprite) { ctxObj.sprite.deleted = true; pendingPresses.delete(ctxObj.sprite.name); if (grabState && grabState.sprite === ctxObj.sprite) grabState = null; } renderGame(); return; }
    if (line === 'TSprite.now') { if (ctxObj.sprite) ctxObj.sprite.deleted = false; renderGame(); return; }
    if (line === 'TSprite.hide') { if (ctxObj.sprite) { ctxObj.sprite.deleted = true; pendingPresses.delete(ctxObj.sprite.name); if (grabState && grabState.sprite === ctxObj.sprite) grabState = null; } renderGame(); return; }
    if (line === 'TSprite.show') { if (ctxObj.sprite) ctxObj.sprite.deleted = false; renderGame(); return; }

    let args = matchCall(line, 'TSprite\\.move');
    if (args) {
      if (args.length !== 2) throw new Error('TSprite.move(x/y, число)');
      const axis = args[0], val = evalExpr(args[1], ctxObj);
      if (axis !== 'x' && axis !== 'y') throw new Error('TSprite.move: первым аргументом x или y');
      if (ctxObj.sprite) { ctxObj.sprite[axis] += Number(val) || 0; clampSprite(ctxObj.sprite); }
      renderGame(); return;
    }
    args = matchCall(line, 'TSprite\\.pos');
    if (args) {
      if (args.length !== 2) throw new Error('TSprite.pos(x, y)');
      const x = Number(evalExpr(args[0], ctxObj)), y = Number(evalExpr(args[1], ctxObj));
      if (ctxObj.sprite) { ctxObj.sprite.x = x; ctxObj.sprite.y = y; clampSprite(ctxObj.sprite); }
      renderGame(); return;
    }
    args = matchCall(line, 'TSprite\\.grab');
    if (args) {
      if (!ctxObj.sprite) throw new Error('TSprite.grab: используется вне скрипта спрайта');
      const box = parseGrabArgs(args, ctxObj);
      ctxObj.sprite.grabbable = box;
      renderGame(); return;
    }
    args = matchCall(line, 'TSprite\\.collision');
    if (args) {
      if (!ctxObj.sprite) throw new Error('TSprite.collision: используется вне скрипта спрайта');
      if (args.length !== 1) throw new Error('TSprite.collision(True/False)');
      const raw = evalExpr(args[0], ctxObj);
      const enabled = (raw === true || String(raw).toLowerCase() === 'true');
      ctxObj.sprite.collision = enabled;
      if (!enabled) {
        pendingPresses.delete(ctxObj.sprite.name);
        pendingReleased.delete(ctxObj.sprite.name);
        ctxObj.sprite.pressStart = null;
        if (grabState && grabState.sprite === ctxObj.sprite) grabState = null;
      }
      renderGame(); return;
    }
    args = matchCall(line, 'rotation');
    if (args) {
      if (args.length !== 1) throw new Error('rotation(сторона/угол)');
      const raw = evalExpr(args[0], ctxObj); let deg = Number(raw);
      if (!isFinite(deg)) { const k = String(raw).toLowerCase(); if (k === 'left') deg = -90; else if (k === 'right') deg = 90; else if (k === 'up') deg = 0; else if (k === 'down') deg = 180; else deg = 0; }
      deg = Math.round(deg / 90) * 90; deg = ((deg % 360) + 360) % 360;
      if (ctxObj.sprite) for (let i = 0; i < deg / 90; i++) rotateSprite90cw(ctxObj.sprite);
      renderGame(); return;
    }

    let m = line.match(/^anim\.([A-Za-z_]\w*)\.(play|stop)\s*\(\s*\)$/);
    if (m) {
      if (!ctxObj.sprite) throw new Error('anim можно использовать только в скрипте спрайта');
      if (m[2] === 'play') {
        const anim = (currentGame.animations || []).find(a => a.name === m[1]);
        if (!anim) throw new Error('Анимация "' + m[1] + '" не найдена');
        ctxObj.sprite._anim = { animation: anim, startTime: performance.now() };
      } else ctxObj.sprite._anim = null;
      renderGame(); return;
    }

    m = line.match(/^([A-Za-z_]\w*)\.grab\s*\((.*)\)$/);
    if (m && !RESERVED_PREFIXES.includes(m[1])) {
      const sp = sprites.find(x => x.name === m[1]);
      if (sp) {
        const a = splitArgs(m[2]);
        const box = parseGrabArgs(a, ctxObj);
        sp.grabbable = box;
        renderGame(); return;
      }
    }

    m = line.match(/^([A-Za-z_]\w*)\.collision\s*\((.*)\)$/);
    if (m && !RESERVED_PREFIXES.includes(m[1])) {
      const sp = sprites.find(x => x.name === m[1]);
      if (sp) {
        const a = splitArgs(m[2]);
        if (a.length !== 1) throw new Error(m[1] + '.collision(True/False)');
        const raw = evalExpr(a[0], ctxObj);
        const enabled = (raw === true || String(raw).toLowerCase() === 'true');
        sp.collision = enabled;
        if (!enabled) {
          pendingPresses.delete(sp.name);
          pendingReleased.delete(sp.name);
          sp.pressStart = null;
          if (grabState && grabState.sprite === sp) grabState = null;
        }
        renderGame(); return;
      }
    }

    m = line.match(/^tags\.([A-Za-z_]\w*)\.(delete|hide|now|show)$/);
    if (m) { const hide = (m[2] === 'delete' || m[2] === 'hide'); for (const s of spritesWithTag(m[1])) { s.deleted = hide; if (hide) pendingPresses.delete(s.name); if (hide && grabState && grabState.sprite === s) grabState = null; } renderGame(); return; }
    m = line.match(/^tags\.([A-Za-z_]\w*)\.move\s*\((.*)\)$/);
    if (m) {
      const a = splitArgs(m[2]); if (a.length !== 2) throw new Error('tags.X.move(x/y, число)');
      if (a[0] !== 'x' && a[0] !== 'y') throw new Error('tags.X.move: первым аргументом x или y');
      const axis = a[0], val = Number(evalExpr(a[1], ctxObj)) || 0;
      for (const s of spritesWithTag(m[1])) { s[axis] += val; clampSprite(s); }
      renderGame(); return;
    }
    m = line.match(/^tags\.([A-Za-z_]\w*)\.pos\s*\((.*)\)$/);
    if (m) {
      const a = splitArgs(m[2]); if (a.length !== 2) throw new Error('tags.X.pos(x, y)');
      const tx = Number(evalExpr(a[0], ctxObj)), ty = Number(evalExpr(a[1], ctxObj));
      for (const s of spritesWithTag(m[1])) { s.x = tx; s.y = ty; clampSprite(s); }
      renderGame(); return;
    }

    let allCall = parseAllArgs(line, 'hide') || parseAllArgs(line, 'delete');
    if (allCall) {
      const exSet = evalAllExceptions(allCall.args, ctxObj);
      for (const s of sprites) { if (!exSet.has(s.name)) { s.deleted = true; if (grabState && grabState.sprite === s) grabState = null; } }
      for (const t of worldTexts) { if (t.id && exSet.has(t.id)) continue; t.hidden = true; }
      for (let y = 0; y < WORLD; y++) for (let x = 0; x < WORLD; x++) { const pid = worldPixId[y][x]; if (pid === null) continue; if (!exSet.has(pid)) worldPixHidden[y][x] = true; }
      for (const name of Array.from(pendingPresses)) if (!exSet.has(name)) pendingPresses.delete(name);
      renderGame(); return;
    }
    allCall = parseAllArgs(line, 'show') || parseAllArgs(line, 'now');
    if (allCall) {
      const exSet = evalAllExceptions(allCall.args, ctxObj);
      for (const s of sprites) { if (!exSet.has(s.name)) s.deleted = false; }
      for (const t of worldTexts) { if (exSet.size === 0) t.hidden = false; else if (t.id && !exSet.has(t.id)) t.hidden = false; else if (!t.id) t.hidden = false; }
      for (let y = 0; y < WORLD; y++) for (let x = 0; x < WORLD; x++) { const pid = worldPixId[y][x]; if (pid === null) continue; if (!exSet.has(pid)) worldPixHidden[y][x] = false; }
      renderGame(); return;
    }
    let allMoveCall = parseAllCallArgs(line, 'move');
    if (allMoveCall) {
      const a = allMoveCall.args; if (a.length < 2) throw new Error('all.move(x/y, число, [исключения...])');
      if (a[0] !== 'x' && a[0] !== 'y') throw new Error('all.move: первым аргументом x или y');
      const axis = a[0], val = Number(evalExpr(a[1], ctxObj)) || 0;
      const exSet = evalAllExceptions(a.slice(2), ctxObj);
      for (const s of sprites) { if (!exSet.has(s.name)) { s[axis] += val; clampSprite(s); } }
      for (const t of worldTexts) { if (!(t.id && exSet.has(t.id))) t[axis] += val; }
      const allPixIds = new Set();
      for (let y = 0; y < WORLD; y++) for (let x = 0; x < WORLD; x++) if (worldPixId[y][x] !== null) allPixIds.add(worldPixId[y][x]);
      for (const pid of allPixIds) { if (exSet.has(pid)) continue; const pixs = collectPixelsById(pid); clearPixels(pixs); for (const p of pixs) { if (axis === 'x') p.x += val; else p.y += val; } placePixels(pixs); }
      renderGame(); return;
    }
    let allPosCall = parseAllCallArgs(line, 'pos');
    if (allPosCall) {
      const a = allPosCall.args; if (a.length < 2) throw new Error('all.pos(x, y, [исключения...])');
      const tx = Number(evalExpr(a[0], ctxObj)), ty = Number(evalExpr(a[1], ctxObj));
      const exSet = evalAllExceptions(a.slice(2), ctxObj);
      for (const s of sprites) { if (!exSet.has(s.name)) { s.x = tx; s.y = ty; clampSprite(s); } }
      for (const t of worldTexts) { if (!(t.id && exSet.has(t.id))) { t.x = tx; t.y = ty; } }
      renderGame(); return;
    }
    m = line.match(/^([A-Za-z_]\w*)\.(delete|hide|now|show)$/);
    if (m && !RESERVED_PREFIXES.includes(m[1])) {
      const hide = (m[2] === 'delete' || m[2] === 'hide');
      const sp = sprites.find(x => x.name === m[1]);
      if (sp) { sp.deleted = hide; if (hide) pendingPresses.delete(sp.name); if (hide && grabState && grabState.sprite === sp) grabState = null; renderGame(); return; }
      let found = false;
      for (const t of worldTexts) if (t.id === m[1]) { t.hidden = hide; found = true; }
      for (let y = 0; y < WORLD; y++) for (let x = 0; x < WORLD; x++) if (worldPixId[y][x] === m[1]) { worldPixHidden[y][x] = hide; found = true; }
      if (found) { renderGame(); return; }
    }
    m = line.match(/^([A-Za-z_]\w*)\.move\s*\((.*)\)$/);
    if (m && !RESERVED_PREFIXES.includes(m[1])) {
      const a = splitArgs(m[2]); if (a.length !== 2) throw new Error(m[1] + '.move(x/y, число)');
      if (a[0] !== 'x' && a[0] !== 'y') throw new Error(m[1] + '.move: первым аргументом x или y');
      const axis = a[0], val = Number(evalExpr(a[1], ctxObj)) || 0;
      const sp = sprites.find(x => x.name === m[1]);
      if (sp) { sp[axis] += val; clampSprite(sp); renderGame(); return; }
      let found = false;
      for (const t of worldTexts) if (t.id === m[1]) { t[axis] += val; found = true; }
      const pixs = collectPixelsById(m[1]);
      if (pixs.length) { clearPixels(pixs); for (const p of pixs) { if (axis === 'x') p.x += val; else p.y += val; } placePixels(pixs); found = true; }
      if (found) { renderGame(); return; }
    }
    m = line.match(/^([A-Za-z_]\w*)\.pos\s*\((.*)\)$/);
    if (m && !RESERVED_PREFIXES.includes(m[1])) {
      const a = splitArgs(m[2]); if (a.length !== 2) throw new Error(m[1] + '.pos(x, y)');
      const tx = Number(evalExpr(a[0], ctxObj)), ty = Number(evalExpr(a[1], ctxObj));
      const sp = sprites.find(x => x.name === m[1]);
      if (sp) { sp.x = tx; sp.y = ty; clampSprite(sp); renderGame(); return; }
      const texts = worldTexts.filter(t => t.id === m[1]); const pixs = collectPixelsById(m[1]);
      if (texts.length || pixs.length) {
        let minX = Infinity, minY = Infinity;
        for (const t of texts) { if (t.x < minX) minX = t.x; if (t.y < minY) minY = t.y; }
        for (const p of pixs) { if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y; }
        if (!isFinite(minX)) { minX = 0; minY = 0; }
        const dx = tx - minX, dy = ty - minY;
        for (const t of texts) { t.x += dx; t.y += dy; }
        if (pixs.length) { clearPixels(pixs); for (const p of pixs) { p.x += dx; p.y += dy; } placePixels(pixs); }
        renderGame(); return;
      }
    }
    args = matchCall(line, 'Spawn');
    if (args) {
      if (args.length !== 3) throw new Error('Spawn(имя, x, y)');
      let nm = String(evalExpr(args[0], ctxObj)).replace(/^"|"$/g, '');
      const x = Number(evalExpr(args[1], ctxObj)), y = Number(evalExpr(args[2], ctxObj));
      const proto = sprites.find(s => s.name === nm && !s._copy) || sprites.find(s => s.name === nm);
      if (!proto) throw new Error('Spawn: спрайт "' + nm + '" не найден');
      sprites.push({ name: nm, pixels: proto.pixels.map(r => r.slice()), size: proto.size || DEFAULT_SPRITE_SIZE, x, y, deleted: false, script: proto.script, _copy: true, pressStart: null, tags: (proto.tags || []).slice(), grabbable: null, collision: true });
      renderGame(); return;
    }
    args = matchCall(line, 'Kill');
    if (args) {
      let nm = String(evalExpr(args[0], ctxObj)).replace(/^"|"$/g, '');
      sprites = sprites.filter(s => s.name !== nm);
      pendingPresses.delete(nm); pendingReleased.delete(nm);
      if (grabState && grabState.sprite && grabState.sprite.name === nm) grabState = null;
      renderGame(); return;
    }
    args = matchCall(line, 'Wait');
    if (args) { const v = Number(evalExpr(args[0], ctxObj)) || 0; await new Promise(r => setTimeout(r, Math.min(v, 60000))); return; }
    args = matchCall(line, 'sound');
    if (args) {
      if (args.length < 1 || args.length > 3) throw new Error('sound(имя, [громкость 0-1], [скорость])');
      const nm = String(evalExpr(args[0], ctxObj)).replace(/^"|"$/g, '');
      const vol = args.length >= 2 ? evalExpr(args[1], ctxObj) : undefined;
      const sp = args.length >= 3 ? evalExpr(args[2], ctxObj) : undefined;
      const track = music.find(t => t.name === nm);
      if (track) playMusicTrack(track, vol, sp);
      return;
    }
    m = line.match(/^math\s*\((.*)\)\s*=:=\s*([A-Za-z_]\w*)$/) || line.match(/^math\s+(.+?)\s*=:=\s*([A-Za-z_]\w*)$/);
    if (m) { vars.set(m[2], evalMathExpr(m[1], ctxObj)); return; }
    m = line.match(/^math\s*\((.*)\)$/) || line.match(/^math\s+(.+)$/);
    if (m) { log.push(String(evalMathExpr(m[1], ctxObj))); updateLog(); return; }
    m = line.match(/^str\s*\((.*)\)\s*=:=\s*([A-Za-z_]\w*)$/) || line.match(/^str\s+(.+?)\s*=:=\s*([A-Za-z_]\w*)$/);
    if (m) { vars.set(m[2], evalStrExpr(m[1], ctxObj)); return; }
    m = line.match(/^str\s*\((.*)\)$/) || line.match(/^str\s+(.+)$/);
    if (m) { log.push(String(evalStrExpr(m[1], ctxObj))); updateLog(); return; }
    args = matchCall(line, 'createP');
    if (args) {
      if (args.length !== 3 && args.length !== 4) throw new Error('createP(x, y, цвет, [id])');
      const x = Number(evalExpr(args[0], ctxObj)), y = Number(evalExpr(args[1], ctxObj));
      const c = resolveColor(evalExpr(args[2], ctxObj));
      const id = args.length === 4 ? String(evalExpr(args[3], ctxObj)) : null;
      if (y >= 0 && y < WORLD && x >= 0 && x < WORLD) {
        const wasHidden = (worldPixId[y][x] === id) ? worldPixHidden[y][x] : false;
        world[y][x] = c; worldPixId[y][x] = id; worldPixHidden[y][x] = wasHidden;
      }
      renderGame(); return;
    }
    args = matchCall(line, 'DelP');
    if (args) {
      if (args.length !== 2) throw new Error('DelP(x, y)');
      const x = Number(evalExpr(args[0], ctxObj)), y = Number(evalExpr(args[1], ctxObj));
      if (y >= 0 && y < WORLD && x >= 0 && x < WORLD) { world[y][x] = null; worldPixId[y][x] = null; worldPixHidden[y][x] = false; }
      renderGame(); return;
    }
    args = matchCall(line, 'createT');
    if (args) {
      if (args.length !== 4 && args.length !== 5) throw new Error('createT(текст, цвет, x, y, [id])');
      const t = evalExpr(args[0], ctxObj);
      const c = resolveColor(evalExpr(args[1], ctxObj));
      const x = Number(evalExpr(args[2], ctxObj)), y = Number(evalExpr(args[3], ctxObj));
      const id = args.length === 5 ? String(evalExpr(args[4], ctxObj)) : null;
      const existing = worldTexts.find(o => o.x === x && o.y === y && o.id === id);
      const wasHidden = existing ? existing.hidden : false;
      worldTexts = worldTexts.filter(o => !(o.x === x && o.y === y && o.id === id));
      worldTexts.push({ text: String(t), color: c, x, y, hidden: wasHidden, id });
      renderGame(); return;
    }
    args = matchCall(line, 'print');
    if (args) { log.push(args.map(a => String(evalExpr(a, ctxObj))).join(' ')); updateLog(); return; }
    m = line.match(/^var\s+([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if (m) { if (!vars.has(m[1])) vars.set(m[1], evalExpr(m[2], ctxObj)); return; }
    m = line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if (m && !line.includes('=:=')) { vars.set(m[1], evalExpr(m[2], ctxObj)); return; }
    m = line.match(/^([A-Za-z_]\w*)\s*\(\s*\)$/);
    if (m && funcs.has(m[1])) { await execute(funcs.get(m[1]), ctxObj); return; }
    throw new Error('неизвестная команда: ' + line);
  }

  async function startGame() {
    if (!currentGame) return;
    gameGen++;
    WORLD = Math.max(MIN_WORLD, Math.min(MAX_WORLD, currentGame.worldSize || DEFAULT_WORLD));
    world = Array.from({length: WORLD}, () => Array(WORLD).fill(null));
    worldPixId = Array.from({length: WORLD}, () => Array(WORLD).fill(null));
    worldPixHidden = Array.from({length: WORLD}, () => Array(WORLD).fill(false));
    worldTexts = [];
    vars = new Map(); funcs = new Map();
    paused = false; log = [];
    gameStartTime = performance.now(); grabState = null;
    logWin.style.display = 'none'; updateLog();
    mouseX = -1; mouseY = -1; mouseDown = false;
    mouseButtons = { left: false, right: false, middle: false };
    pendingClicks = { left: 0, right: 0, middle: 0 };
    pendingPresses = new Set(); pendingReleased = new Set();
    keysPressed = new Set(); keysPending = new Set();

    sprites = currentGame.sprites
      .filter(s => s.placed)
      .map(s => ({ name: s.name, pixels: s.pixels, size: s.size || DEFAULT_SPRITE_SIZE, x: s.x, y: s.y, deleted: false, script: s.script, pressStart: null, tags: (s.tags || []).slice(), grabbable: null, collision: true }));

    const preScripts = [currentGame.globalScript, ...sprites.map(s => s.script)];
    for (const code of preScripts) {
      if (!code || !code.trim()) continue;
      for (const rawLine of code.split('\n')) {
        const l = rawLine.replace(/(^|[^:"'])\/\/.*$/, '$1').trim();
        const m = l.match(/^var\s+([A-Za-z_]\w*)\s*=\s*(.+)$/);
        if (m && !vars.has(m[1])) { try { vars.set(m[1], evalExpr(m[2], { vars, sprite: null })); } catch (e) {} }
      }
    }

    state = 'playing'; gameRunning = true; renderAll();
    if (currentGame.globalScript.trim()) runScript(currentGame.globalScript, { vars, sprite: null });
    for (const s of sprites) { if (s.script && s.script.trim()) runScript(s.script, { vars, sprite: s }); }
  }

  async function runScript(code, ctxObj) {
    const gen = gameGen;
    let ast; try { ast = parseProgram(code); } catch (e) { showError(e); return; }
    while (gameRunning && gen === gameGen) {
      try { await execute(ast, ctxObj); }
      catch (e) { if (e instanceof BreakSignal || e instanceof ContinueSignal) {} else { showError(e); return; } }
      if (gen !== gameGen || !gameRunning) return;
      await new Promise(r => setTimeout(r, 16));
    }
  }
  function showError(e) {
    const box = el('div', 'error-box');
    box.textContent = 'код не правильно компилирован: ' + (e && e.message ? e.message : String(e));
    right.appendChild(box);
    setTimeout(() => { if (box.parentNode) box.remove(); }, 12000);
  }

  window.addEventListener('resize', () => {
    if (state === 'playing') renderGame();
    else if (state === 'spriteCreator') renderSpriteCreatorCanvas();
    else if (state === 'animationEditor') renderAnimationEditorCanvas();
    else if (state === 'scriptEditor') renderScriptEditorCanvas();
    else if (state === 'editor') renderEditorCanvas();
    else if (state === 'musicEditor') renderMusicEditorCanvas();
    else renderMenuCanvas();
  });

  document.addEventListener('mousedown', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); }, true);

  loadSyntaxColors();
  try {
    const toRem = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('ledame_snd_') || k === 'ledame_games_v1' || k === 'ledame_games_v2')) toRem.push(k);
    }
    for (const k of toRem) localStorage.removeItem(k);
  } catch (e) {}
  games = loadSavedGames();
  music = loadSavedMusic();
  renderAll();
})();
</script>
